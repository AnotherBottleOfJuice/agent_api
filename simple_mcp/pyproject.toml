[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_api"
version = "0.1.0"
description = "Agent API service and a simple MCP example (FastAPI + MCP)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["fastapi", "mcp", "agent", "api"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

dependencies = [
	"fastapi>=0.95",
	"uvicorn>=0.21",
	"python-dotenv>=1.0",
	"starlette>=0.27",
	"mcp>=0.1",
]

[project.optional-dependencies]
dev = [
	"pytest>=7.0",
	"pytest-asyncio>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_mcp*"]

